<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img" aria-label="Endpoint flow: describe data, Gemini drafts JSON, Endpoint validates it, you call a live API"><rect x="0.5" y="0.5" width="819" height="229" rx="10" fill="#0E1726" stroke="#22304A"/><rect x="30.0" y="56" width="172" height="118" rx="8" fill="#15213A" stroke="#22304A" stroke-width="1"/><text x="46.0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#D6DEEB">You describe it</text><text x="46.0" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#F0B46A">"20 users with name,</text><text x="46.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#F0B46A">email and a plan"</text><path d="M206.0 115.0h14m-5 -4l5 4l-5 4" fill="none" stroke="#8A97AD" stroke-width="1.4"/><rect x="226.0" y="56" width="172" height="118" rx="8" fill="#15213A" stroke="#22304A" stroke-width="1"/><text x="242.0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#D6DEEB">Gemini drafts it</text><text x="242.0" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8A97AD">structured JSON</text><text x="242.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8A97AD">from the prompt</text><path d="M402.0 115.0h14m-5 -4l5 4l-5 4" fill="none" stroke="#8A97AD" stroke-width="1.4"/><rect x="422.0" y="56" width="172" height="118" rx="8" fill="#15213A" stroke="#22304A" stroke-width="1"/><text x="438.0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#D6DEEB">Endpoint checks it</text><text x="438.0" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8A97AD">schema validation,</text><text x="438.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8A97AD">Faker.js, cache</text><path d="M598.0 115.0h14m-5 -4l5 4l-5 4" fill="none" stroke="#8A97AD" stroke-width="1.4"/><rect x="618.0" y="56" width="172" height="118" rx="8" fill="#15213A" stroke="#5CCF9E" stroke-width="1.5"/><text x="634.0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#D6DEEB">You call it</text><text x="634.0" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8A97AD">GET /api/users</text><text x="634.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8A97AD">live, any method</text><text x="30.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8A97AD">How Endpoint turns a sentence into a working API</text><text x="30.0" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8A97AD">Requests stream to a live inspector over SSE. Auth, CORS, latency and errors are configurable.</text></svg>