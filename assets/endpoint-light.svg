<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img" aria-label="Endpoint flow: describe data, Gemini drafts JSON, Endpoint validates it, you call a live API"><rect x="0.5" y="0.5" width="819" height="229" rx="10" fill="#FFFFFF" stroke="#D8DEE9"/><rect x="30.0" y="56" width="172" height="118" rx="8" fill="#F3F5F9" stroke="#D8DEE9" stroke-width="1"/><text x="46.0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937">You describe it</text><text x="46.0" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#A3521B">"20 users with name,</text><text x="46.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#A3521B">email and a plan"</text><path d="M206.0 115.0h14m-5 -4l5 4l-5 4" fill="none" stroke="#6B7280" stroke-width="1.4"/><rect x="226.0" y="56" width="172" height="118" rx="8" fill="#F3F5F9" stroke="#D8DEE9" stroke-width="1"/><text x="242.0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937">Gemini drafts it</text><text x="242.0" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#6B7280">structured JSON</text><text x="242.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#6B7280">from the prompt</text><path d="M402.0 115.0h14m-5 -4l5 4l-5 4" fill="none" stroke="#6B7280" stroke-width="1.4"/><rect x="422.0" y="56" width="172" height="118" rx="8" fill="#F3F5F9" stroke="#D8DEE9" stroke-width="1"/><text x="438.0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937">Endpoint checks it</text><text x="438.0" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#6B7280">schema validation,</text><text x="438.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#6B7280">Faker.js, cache</text><path d="M598.0 115.0h14m-5 -4l5 4l-5 4" fill="none" stroke="#6B7280" stroke-width="1.4"/><rect x="618.0" y="56" width="172" height="118" rx="8" fill="#F3F5F9" stroke="#1E7F5C" stroke-width="1.5"/><text x="634.0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2937">You call it</text><text x="634.0" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#6B7280">GET /api/users</text><text x="634.0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#6B7280">live, any method</text><text x="30.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6B7280">How Endpoint turns a sentence into a working API</text><text x="30.0" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">Requests stream to a live inspector over SSE. Auth, CORS, latency and errors are configurable.</text></svg>